services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm i -g bun@1 >/dev/null 2>&1 && bun install --frozen-lockfile && npx vite dev --host 0.0.0.0 --port 8080"
    ports:
      - "3000:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --max-time 5 http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 180s

volumes:
  node_modules:
