services:
  web:
    image: oven/bun:1.2-debian
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # Vite >= 6.1 appends this to allowedHosts (platform sets the value).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bun run dev -- --host 0.0.0.0 --port 3000 --strictPort false"]
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/').then(r=>{if(!r.ok)throw new Error('status '+r.status)}).catch(e=>{console.error(e);throw e})\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
