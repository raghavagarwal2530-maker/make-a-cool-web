<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Your WorkWave verification code</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #202020;">
    <h1>Your WorkWave verification code</h1>
    <p>Enter this six-digit code on the WorkWave page where you requested it:</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>
    <p>Keep your original WorkWave tab open. You do not need to click a login link.</p>
    <p>Do not share this code. If you did not request it, you can ignore this email.</p>
  </body>
</html>
